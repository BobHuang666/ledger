# Nginx 反向代理配置样例
# 路径：/etc/nginx/sites-available/你的域名
# 创建软链接：ln -sf /etc/nginx/sites-available/你的域名 /etc/nginx/sites-enabled/
# 修改后执行：nginx -t && systemctl reload nginx
# SSL 证书需手动部署（腾讯云 SSL 或 Let's Encrypt certbot）

server {
    listen 80;
    server_name ledger.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ledger.example.com;

    ssl_certificate /etc/nginx/ssl/your_domain_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/your_domain.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # gzip 压缩：echarts 产物 1MB，gzip 后约 330KB
    gzip on;
    gzip_types text/plain application/json application/javascript text/css image/svg+xml;
    gzip_min_length 256;

    location /ledger/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

