# Nginx 反向代理配置模板
# 路径：/etc/nginx/sites-available/你的域名
# 创建软链接：ln -sf /etc/nginx/sites-available/你的域名 /etc/nginx/sites-enabled/
# 修改后执行：nginx -t && systemctl reload nginx
# SSL 证书需手动部署（腾讯云 SSL 或 Let's Encrypt certbot）
# DNS 解析：需同时添加 @ 和 www 两条 A 记录指向服务器 IP

# ---------- HTTP 80 → HTTPS ----------
server {
    listen 80;
    server_name example.com www.example.com;
    return 301 https://example.com$request_uri;
}

# ---------- HTTPS: www → 根域名重定向 ----------
server {
    listen 443 ssl;
    http2 on;
    server_name www.example.com;

    ssl_certificate /etc/nginx/ssl/your_domain_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/your_domain.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    return 301 https://example.com$request_uri;
}

# ---------- HTTPS: 根域名主站点 ----------
server {
    listen 443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate /etc/nginx/ssl/your_domain_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/your_domain.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # gzip 压缩：echarts 产物 1MB，gzip 后约 330KB
    gzip on;
    gzip_types text/plain application/json application/javascript text/css image/svg+xml;
    gzip_min_length 256;

    location /ledger/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /ledger;
        proxy_read_timeout 60s;
    }
}

